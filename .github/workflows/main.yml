name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17 (Android için Gerekli)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Sistem Bağımlılıklarını Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev dirmngr \
          zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libsqlite3-dev libreadline-dev \
          uuid-dev python3-dev python3-pip zip unzip openjdk-17-jdk

    - name: Buildozer ve Cython Kur
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Buildozer ile APK Üret
      run: |
        yes | buildozer -v android debug

    - name: APK Dosyasını Çıkart (Upload)
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
